name: Déployer sur GitHub Pages

on:
  push:
    branches: [ main ] # ou master selon votre branche principale

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Installation des dépendances et Build
        run: |
          npm install
          npm run build # ou le script correspondant à votre projet (ex: vite build)

      - name: 📤 Téléversement de l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Remplacer './dist' par le dossier de build de votre projet (ex: 'build', 'out', etc.)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Déploiement sur GitHub Pages
        uses: actions/deploy-pages@v4
