name: Déployer sur GitHub Pages

on:
  push:
    branches: [ main ] # ou master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js (Version 20 minimum requise)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # <-- Forcer Node 20 ou 22

      - name: 📦 Installation des dépendances et Build
        run: |
          npm install
          npm run build

      - name: 📤 Téléversement de l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Mets ici ton dossier de build (dist, build, etc.)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
